name: Cache generated Struphy example
description: Restore and save the generated files for one deterministic example run
inputs:
  example:
    description: Example script stem
    required: true
  cache-prefix:
    description: Prefix used for the cache key
    required: false
    default: struphy-example-domain-v1
  cache-suffix:
    description: Optional distinguishing suffix, such as an MPI configuration
    required: false
    default: ''
outputs:
  cache-hit:
    description: Whether an exact generated-example cache was restored
    value: ${{ steps.cache.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - name: Resolve cache key and paths
      id: key
      uses: actions/github-script@v7
      env:
        EXAMPLE: ${{ inputs.example }}
        CACHE_PREFIX: ${{ inputs.cache-prefix }}
        CACHE_SUFFIX: ${{ inputs.cache-suffix }}
      with:
        script: |
          const { exampleCache } = require('./.github/scripts/example-cache.cjs');
          const { key, paths } = await exampleCache(
            process.env.EXAMPLE, process.env.CACHE_PREFIX, process.env.CACHE_SUFFIX, glob,
          );
          core.setOutput('key', key);
          core.setOutput('paths', paths.join('\n'));

    - name: Cache generated example
      id: cache
      uses: actions/cache@v4
      with:
        path: ${{ steps.key.outputs.paths }}
        key: ${{ steps.key.outputs.key }}
