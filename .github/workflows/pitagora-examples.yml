name: Pitagora Examples

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# All branches share the same virtual environment on Pitagora.
concurrency:
  group: pitagora-examples
  cancel-in-progress: false

jobs:
  list-examples:
    runs-on: ubuntu-latest
    outputs:
      examples: ${{ steps.list.outputs.examples }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: List Pitagora examples
        id: list
        run: echo "examples=$(python scripts/pitagora_examples.py --json)" >> "$GITHUB_OUTPUT"

  run-examples:
    needs: list-examples
    runs-on: [self-hosted, pitagora]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # The selected examples share Pitagora's persistent virtual environment.
      max-parallel: 1
      matrix:
        example: ${{ fromJson(needs.list-examples.outputs.examples) }}
    env:
      OMP_NUM_THREADS: 1
      SLURM_ACCOUNT: FUSIO_HLST_7
      SLURM_PARTITION: dcgp_fua_dbg
    steps:
      - name: Check out repository and Struphy
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache generated example
        id: cache-example
        uses: ./.github/actions/cache-example
        with:
          example: ${{ matrix.example }}
          cache-prefix: pitagora-example-v1

      - name: Install Struphy and run example
        if: steps.cache-example.outputs.cache-hit != 'true'
        # A login shell initializes the cluster's module command. Keep setup and
        # execution together so module and virtual-environment settings persist.
        shell: bash -l -e -o pipefail {0}
        run: |
          hostname
          module load \
            gcc/12.3.0 \
            python/3.11.7 \
            hdf5/1.14.3--gcc--12.3.0 \
            cmake/3.27.9 \
            netcdf-fortran/4.6.1--gcc--12.3.0 \
            netlib-scalapack/2.2.0--openmpi--4.1.6--gcc--12.3.0-ucx1.20

          # GVEC currently needs explicit compiler paths for this GCC stack.
          # Revisit these selections when adding an Intel module stack.
          export FC="$(command -v gfortran)"
          export CC="$(command -v gcc)"
          export CXX="$(command -v g++)"
          source /pitagora_scratch/userexternal/mlindqvi/github_runner_builds/.venv/bin/activate

          git -C submodules/struphy rev-parse HEAD
          python -m pip install './submodules/struphy[phys,mpi]'
          python -m pip install 'scope-profiler[pproc]>=0.6.1,<=0.7.0' kaleido 'slurm-script-generator==0.4.0'
          # Install Chrome into Kaleido's user-accessible location for PNG export.
          kaleido_get_chrome
          struphy compile --status
          # struphy compile -y --language fortran
          # The Python API generates a self-contained serial batch script,
          # submits it, waits for its exact job ID, verifies its final Slurm
          # state, and prints its batch logs.
          python .github/scripts/run-pitagora-example.py "${{ matrix.example }}" \
            --account="$SLURM_ACCOUNT" \
            --partition="$SLURM_PARTITION"

      - name: Verify generated example
        run: |
          test -f "docs/public/examples/${{ matrix.example }}.plotly.json"
          test -f "docs/public/examples/${{ matrix.example }}.html"

      - name: Upload example results
        uses: actions/upload-artifact@v4
        with:
          name: pitagora-${{ matrix.example }}
          path: |
            docs/public/examples/${{ matrix.example }}*
            docs/public/images/examples/${{ matrix.example }}*
            docs/public/example-domains/${{ matrix.example }}*
          if-no-files-found: error
