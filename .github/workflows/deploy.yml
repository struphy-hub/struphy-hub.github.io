name: Build and deploy site

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # docs/src/examples/*.py are full Struphy simulations (see docs/src/examples/README.md)
  # -- their outputs are gitignored (see .gitignore), so every deploy regenerates them here
  # instead of pushing multi-MB HTML/HDF5 files to the repo. Runs in struphy's own
  # precompiled image (see submodules/struphy/docker/ubuntu-latest-with-struphy.dockerfile
  # and .github/workflows/ghcr.yml in that repo) so we skip installing the system toolchain
  # (gfortran, MPI, BLAS/LAPACK, netCDF, ...) needed to build gvec/desc-opt from source.
  # struphy-hub.github.io has been granted read access to that (otherwise private) package,
  # so the default GITHUB_TOKEN is enough to pull it -- no extra secret needed.
  generate-examples:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/struphy-hub/struphy/ubuntu-with-struphy:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Trust the checked-out worktree
        # Actions containers run as root; git refuses to touch a worktree owned by another
        # UID ("detected dubious ownership") unless told to trust it -- struphy's own
        # editable install below shells out to git (setuptools-scm) and would hit this.
        run: git config --global --add safe.directory '*'

      # Each run is deterministic (fixed seeds), so cache on the example scripts' and
      # Struphy's own source, and skip the expensive rebuild when neither changed.
      - name: Cache generated examples
        id: cache-examples
        uses: actions/cache@v4
        with:
          path: |
            docs/public/examples/*.html
            docs/public/examples/*.png
            docs/public/examples/*.metadata.json
            docs/public/examples/*-profile.h5
            docs/public/examples/*-durations.json
            docs/public/examples/*-gantt.json
            docs/public/examples/*-flame.json
            docs/public/examples/*-region-stats.json
            docs/public/images/examples/*.png
          key: struphy-examples-${{ hashFiles('docs/src/examples/*.py', 'submodules/struphy/src/struphy/**/*.py') }}

      - name: Install Struphy from this repo's pinned submodule commit
        # Same approach as struphy's own CI
        # (submodules/struphy/.github/actions/install/struphy_in_container/action.yml):
        # the image bakes in whatever struphy commit was HEAD when it was last built, so
        # move /struphy_fortran_'s own checkout to the exact commit our submodule pins
        # (rather than reinstalling editable from a second copy of the source) and
        # reinstall there, reusing the image's already-installed venv and already-built
        # gvec/desc-opt.
        #
        # scope-profiler[pproc] and kaleido aren't pulled in by the phys/mpi extras (only by
        # struphy's own dev/doc extras) but the example scripts need both: scope-profiler's
        # pproc submodule for the durations/gantt/flame plot-data export, kaleido for
        # figure.write_image(...)'s static PNG export.
        if: steps.cache-examples.outputs.cache-hit != 'true'
        shell: bash
        run: |
          STRUPHY_SHA=$(git -C submodules/struphy rev-parse HEAD)
          cd /struphy_fortran_
          git fetch origin --tags
          git checkout "$STRUPHY_SHA"
          source env_fortran_/bin/activate
          pip install -U --upgrade-strategy eager -e ".[phys,mpi]"
          # Struphy pins scope-profiler <=0.5.0 as a hard dependency, but the example
          # scripts use plot_durations(metrics=(...)), a plural-metrics API that only
          # exists from 0.6.1 onward -- --upgrade forces past struphy's conservative pin
          # to the version this was actually developed and tested against.
          pip install --upgrade "scope-profiler[pproc]>=0.6.1" kaleido

      # Chrome doesn't depend on the struphy commit or example scripts, so cache it under
      # its own static key instead of the cache-examples key above -- otherwise every
      # cache-miss run there re-downloads ~150-200MB from Google plus its apt dependencies
      # for no reason.
      - name: Cache Chrome
        if: steps.cache-examples.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: |
            /var/cache/apt/archives/*.deb
            /tmp/chrome.deb
          key: chrome-for-kaleido-v1

      - name: Install Chrome for kaleido
        # kaleido>=1.0 drives Chrome via choreographer instead of bundling a binary, and
        # doesn't auto-download it -- without this, figure.write_image(...) fails with
        # ChromeNotFoundError on a bare container that has no browser installed.
        #
        # Deliberately *not* `kaleido_get_chrome`: it downloads a standalone Chrome build
        # with no shared libraries installed, which crashes on startup on a bare Ubuntu
        # image ("browser closed immediately after starting") -- and choreographer always
        # prefers that self-managed download over a system browser, so it has to not exist
        # in the first place. Installing Google Chrome via apt instead lets apt resolve the
        # actual runtime dependencies (libnss3, libatk-bridge, libgbm, ...) correctly for
        # whatever Ubuntu version this image uses.
        if: steps.cache-examples.outputs.cache-hit != 'true'
        shell: bash
        run: |
          apt-get update
          if [ ! -f /tmp/chrome.deb ]; then
            apt-get install -y wget
            wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          fi
          apt-get install -y /tmp/chrome.deb

      - name: Compile Struphy kernels
        if: steps.cache-examples.outputs.cache-hit != 'true'
        shell: bash
        run: |
          source /struphy_fortran_/env_fortran_/bin/activate
          struphy compile -y --language fortran

      - name: Generate example metadata
        if: steps.cache-examples.outputs.cache-hit != 'true'
        shell: bash
        run: |
          source /struphy_fortran_/env_fortran_/bin/activate
          python generate_examples.py

      - name: Run examples
        if: steps.cache-examples.outputs.cache-hit != 'true'
        working-directory: docs/public/examples
        shell: bash
        run: |
          source /struphy_fortran_/env_fortran_/bin/activate
          for script in ../../src/examples/*.py; do
            echo "::group::$(basename "$script")"
            python "$script"
            echo "::endgroup::"
          done

      - name: Copy example thumbnails
        if: steps.cache-examples.outputs.cache-hit != 'true'
        run: cp docs/public/examples/*.png docs/public/images/examples/

      - name: Clean up simulation scratch output
        if: steps.cache-examples.outputs.cache-hit != 'true'
        run: rm -rf docs/public/examples/struphy_gallery_runs docs/public/examples/struphy.log

      - name: Verify generated examples
        run: test -n "$(find docs/public/examples -maxdepth 1 -name '*.html' -print -quit)"

      - name: Upload generated examples
        uses: actions/upload-artifact@v4
        with:
          name: generated-examples
          path: |
            docs/public/examples
            docs/public/images/examples
          retention-days: 1

  build:
    needs: generate-examples
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Struphy
        run: python -m pip install --upgrade pip && python -m pip install ./submodules/struphy

      - name: Generate equilibrium slices
        run: python generate_equilibrium_slices.py

      - name: Verify generated equilibrium slices
        run: test -n "$(find docs/src/data/equilibria -maxdepth 1 -name '*.json' -print -quit)"

      - name: Generate perturbation plots
        run: python generate_perturbations.py

      - name: Verify generated perturbation plots
        run: test -n "$(find docs/src/data/perturbations -maxdepth 1 -name '*.json' -print -quit)"

      - name: Generate domain geometries
        run: python generate_domains.py docs/public/domains

      - name: Verify generated domain geometries
        run: test -n "$(find docs/public/domains -maxdepth 1 -name '*.vtp' -print -quit)"

      - name: Verify generated domain grids
        run: |
          test -n "$(find docs/public/domains -maxdepth 1 -name '*-xy.json' -print -quit)"
          test -s docs/public/domains/catalogue.json

      - name: Download generated examples
        uses: actions/download-artifact@v4
        with:
          name: generated-examples
          path: docs/public

      - name: Verify generated examples
        run: test -n "$(find docs/public/examples -maxdepth 1 -name '*.html' -print -quit)"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        working-directory: docs
        run: npm ci

      - name: Build site
        working-directory: docs
        run: npm run build

      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
