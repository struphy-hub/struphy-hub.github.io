name: Test site build

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: test-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build-site.yml
    # Pitagora is currently unavailable; run every example on GitHub-hosted runners.
    # Change to true when the Pitagora runner is available again.
    with:
      use_pitagora: false
    permissions:
      contents: read
      packages: read
