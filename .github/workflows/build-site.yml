name: Build site

# Reusable workflow: builds the Astro site (equilibria/perturbations/domains/examples
# generation, then `npm run build`) without deploying anything. Called by both deploy.yml
# (on push to main, followed by an actual deploy) and test.yml (on PRs to main, as a
# build-only check) so the two never drift out of sync.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  # docs/src/examples/*.py are full Struphy simulations (see docs/src/examples/README.md),
  # each run independently as its own matrix job below (they don't share state), so this
  # just discovers the current list for that matrix -- no workflow edit needed to pick up
  # a newly added example.
  list-examples:
    runs-on: ubuntu-latest
    outputs:
      examples: ${{ steps.list.outputs.examples }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: List example scripts
        id: list
        run: |
          # Files prefixed with an underscore are shared helper modules, not runnable
          # examples (for example, _profiling_exports.py). Keep them out of the matrix.
          examples=$(cd docs/src/examples && find . -maxdepth 1 -type f -name '*.py' ! -name '_*.py' ! -name 'poisson-source.py' -printf '%f\n' | sed 's/\.py$//' | jq -R -s -c 'split("\n")[:-1]')
          echo "examples=$examples" >> "$GITHUB_OUTPUT"

  # Poisson is a small special-case smoke test that runs on the Pitagora runner.
  # Its artifact is produced in this same workflow run and consumed by build below.
  pitagora-example:
    uses: ./.github/workflows/pitagora-examples.yml
    permissions:
      contents: read

  # A fast test of the site itself, before the examples are run. The Astro build needs the metadata of
  # every example but none of their results, and `generate_examples.py` writes that metadata by importing
  # the scripts without running them (no compiled kernels needed). So this builds the whole site, with
  # every page, in a few minutes, and a broken page, route or metadata file fails here instead of after the
  # slow example runs. It runs in parallel with them and publishes its generated site data for the final
  # `build` job, avoiding a second Struphy installation and a second pass through the generators.
  check-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Struphy
        run: python -m pip install --upgrade pip && python -m pip install ./submodules/struphy

      - name: Generate equilibrium slices
        run: python generate_equilibrium_slices.py

      - name: Generate perturbation plots
        run: python generate_perturbations.py

      - name: Generate domain geometries
        run: python generate_domains.py docs/public/domains

      - name: Verify generated site data
        run: |
          test -n "$(find docs/src/data/equilibria -maxdepth 1 -name '*.json' -print -quit)"
          test -n "$(find docs/src/data/perturbations -maxdepth 1 -name '*.json' -print -quit)"
          test -n "$(find docs/public/domains -maxdepth 1 -name '*.vtp' -print -quit)"
          test -n "$(find docs/public/domains -maxdepth 1 -name '*-xy.json' -print -quit)"
          test -s docs/public/domains/catalogue.json

      - name: Upload generated site data
        uses: actions/upload-artifact@v4
        with:
          name: generated-site-data
          path: |
            docs/src/data/equilibria
            docs/src/data/perturbations
            docs/public/domains
          retention-days: 1

      - name: Generate example metadata (no simulation is run)
        run: python generate_examples.py

      - name: Check example metadata and download routes
        run: python scripts/check_examples.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        working-directory: docs
        run: npm ci

      - name: Build site (without the example results)
        working-directory: docs
        run: npm run build

  # Each example checks its cache before starting a Struphy container.
  run-example:
    needs: list-examples
    strategy:
      fail-fast: false
      matrix:
        example: ${{ fromJson(needs.list-examples.outputs.examples) }}
    uses: ./.github/workflows/run-example.yml
    with:
      example: ${{ matrix.example }}
    permissions:
      contents: read
      packages: read

  build:
    needs: [check-site, pitagora-example, run-example]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download generated site data
        uses: actions/download-artifact@v4
        with:
          name: generated-site-data
          path: docs

      - name: Verify generated equilibrium slices
        run: test -n "$(find docs/src/data/equilibria -maxdepth 1 -name '*.json' -print -quit)"

      - name: Verify generated perturbation plots
        run: test -n "$(find docs/src/data/perturbations -maxdepth 1 -name '*.json' -print -quit)"

      - name: Verify generated domain geometries
        run: test -n "$(find docs/public/domains -maxdepth 1 -name '*.vtp' -print -quit)"

      - name: Verify generated domain grids
        run: |
          test -n "$(find docs/public/domains -maxdepth 1 -name '*-xy.json' -print -quit)"
          test -s docs/public/domains/catalogue.json

      - name: Download generated examples
        uses: actions/download-artifact@v4
        with:
          pattern: generated-example-*
          path: docs/public
          merge-multiple: true

      - name: Download Pitagora examples
        uses: actions/download-artifact@v4
        with:
          pattern: pitagora-*
          path: docs/public
          merge-multiple: true

      - name: Verify and list Pitagora examples
        run: python scripts/pitagora_examples.py --verify-output

      - name: Verify generated examples
        run: |
          test -n "$(find docs/public/examples -maxdepth 1 -name '*.plotly.json' -print -quit)"
          test -n "$(find docs/public/examples -maxdepth 1 -name '*.html' -print -quit)"
          test -n "$(find docs/public/example-domains -maxdepth 1 -name '*.vtp' -print -quit)"

      - name: Check example metadata, figures and download routes
        run: python scripts/check_examples.py --require-figures

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        working-directory: docs
        run: npm ci

      - name: Build site
        working-directory: docs
        run: npm run build

      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist
