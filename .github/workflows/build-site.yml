name: Build site

# Reusable workflow: builds the Astro site (equilibria/perturbations/domains/examples
# generation, then `npm run build`) without deploying anything. Called by both deploy.yml
# (on push to main, followed by an actual deploy) and test.yml (on PRs to main, as a
# build-only check) so the two never drift out of sync.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  # Restore cached outputs once and schedule simulation jobs only for misses.
  list-examples:
    runs-on: ubuntu-latest
    outputs:
      examples: ${{ steps.list.outputs.examples }}
      pitagora-examples: ${{ steps.list.outputs.pitagora-examples }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install cache client
        run: npm install --prefix "$RUNNER_TEMP/example-cache" --no-audit --no-fund --ignore-scripts @actions/cache@4.0.5

      - name: Restore cached examples and list misses
        id: list
        uses: actions/github-script@v7
        with:
          script: |
            const path = require('node:path');
            const cache = require(path.join(process.env.RUNNER_TEMP, 'example-cache/node_modules/@actions/cache'));
            const listExamples = require('./.github/scripts/list-examples.cjs');
            const { listPitagoraExamples } = require('./.github/scripts/list-pitagora-examples.cjs');
            const pitagora = await listPitagoraExamples({ cache, glob, core });
            const standard = await listExamples({ cache, glob, core, exclude: pitagora.examples });
            core.setOutput('examples', JSON.stringify(standard.misses));
            core.setOutput('pitagora-examples', JSON.stringify(pitagora.misses));
            core.setOutput('cached-paths', [...standard.cachedPaths, ...pitagora.cachedPaths].join('\n'));

      - name: Upload cached examples
        if: steps.list.outputs.cached-paths != ''
        uses: actions/upload-artifact@v4
        with:
          name: generated-example-cached
          path: ${{ steps.list.outputs.cached-paths }}
          if-no-files-found: error
          retention-days: 1

  # Pitagora receives just its cache misses and runs them serially in one job.
  pitagora-examples:
    needs: list-examples
    uses: ./.github/workflows/pitagora-examples.yml
    with:
      examples: ${{ needs.list-examples.outputs.pitagora-examples }}
    permissions:
      contents: read

  # A fast test of the site itself, before the examples are run. The Astro build needs the metadata of
  # every example but none of their results, and `generate_examples.py` writes that metadata by importing
  # the scripts without running them (no compiled kernels needed). So this builds the whole site, with
  # every page, in a few minutes, and a broken page, route or metadata file fails here instead of after the
  # slow example runs. It runs in parallel with them and publishes its generated site data for the final
  # `build` job, avoiding a second Struphy installation and a second pass through the generators.
  check-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Struphy
        run: python -m pip install --upgrade pip && python -m pip install ./submodules/struphy

      - name: Generate equilibrium slices
        run: python generate_equilibrium_slices.py

      - name: Generate perturbation plots
        run: python generate_perturbations.py

      - name: Generate domain geometries
        run: python generate_domains.py docs/public/domains

      - name: Verify generated site data
        run: |
          test -n "$(find docs/src/data/equilibria -maxdepth 1 -name '*.json' -print -quit)"
          test -n "$(find docs/src/data/perturbations -maxdepth 1 -name '*.json' -print -quit)"
          test -n "$(find docs/public/domains -maxdepth 1 -name '*.vtp' -print -quit)"
          test -n "$(find docs/public/domains -maxdepth 1 -name '*-xy.json' -print -quit)"
          test -s docs/public/domains/catalogue.json

      - name: Upload generated site data
        uses: actions/upload-artifact@v4
        with:
          name: generated-site-data
          path: |
            docs/src/data/equilibria
            docs/src/data/perturbations
            docs/public/domains
          retention-days: 1

      - name: Generate example metadata (no simulation is run)
        run: python generate_examples.py

      - name: Check example metadata and download routes
        run: python scripts/check_examples.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        working-directory: docs
        run: npm ci

      - name: Build site (without the example results)
        working-directory: docs
        run: npm run build

  # Only cache misses start a Struphy container.
  run-example:
    name: ${{ matrix.example }}
    needs: list-examples
    if: needs.list-examples.outputs.examples != '[]'
    strategy:
      fail-fast: false
      matrix:
        example: ${{ fromJson(needs.list-examples.outputs.examples) }}
    uses: ./.github/workflows/run-example.yml
    with:
      example: ${{ matrix.example }}
    permissions:
      contents: read
      packages: read

  build:
    needs: [list-examples, check-site, pitagora-examples, run-example]
    # An all-cached run skips the simulation matrix but must still build the site.
    if: >-
      ${{ !cancelled() && needs.list-examples.result == 'success' &&
          needs.check-site.result == 'success' && needs.pitagora-examples.result == 'success' &&
          (needs.run-example.result == 'success' || needs.run-example.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download generated site data
        uses: actions/download-artifact@v4
        with:
          name: generated-site-data
          path: docs

      - name: Verify generated equilibrium slices
        run: test -n "$(find docs/src/data/equilibria -maxdepth 1 -name '*.json' -print -quit)"

      - name: Verify generated perturbation plots
        run: test -n "$(find docs/src/data/perturbations -maxdepth 1 -name '*.json' -print -quit)"

      - name: Verify generated domain geometries
        run: test -n "$(find docs/public/domains -maxdepth 1 -name '*.vtp' -print -quit)"

      - name: Verify generated domain grids
        run: |
          test -n "$(find docs/public/domains -maxdepth 1 -name '*-xy.json' -print -quit)"
          test -s docs/public/domains/catalogue.json

      - name: Download generated examples
        uses: actions/download-artifact@v4
        with:
          pattern: generated-example-*
          path: docs/public
          merge-multiple: true

      - name: Download Pitagora examples
        uses: actions/download-artifact@v4
        with:
          pattern: pitagora-*
          path: docs/public
          merge-multiple: true

      # The self-hosted Pitagora runner has no npm command. Save its completed
      # examples as individual caches here, on the Ubuntu runner, after their
      # artifact has been downloaded.
      - name: Install cache client for Pitagora results
        if: needs.list-examples.outputs.pitagora-examples != '[]'
        run: npm install --prefix "$RUNNER_TEMP/example-cache" --no-audit --no-fund --ignore-scripts @actions/cache@4.0.5

      - name: Save Pitagora examples in cache
        if: needs.list-examples.outputs.pitagora-examples != '[]'
        uses: actions/github-script@v7
        env:
          EXAMPLES: ${{ needs.list-examples.outputs.pitagora-examples }}
        with:
          script: |
            const path = require('node:path');
            const cache = require(path.join(process.env.RUNNER_TEMP, 'example-cache/node_modules/@actions/cache'));
            const { exampleCache } = require('./.github/scripts/example-cache.cjs');
            for (const example of JSON.parse(process.env.EXAMPLES)) {
              const { key, paths } = await exampleCache(example, 'pitagora-example-v1', '', glob);
              await cache.saveCache(paths, key);
              core.info(`Saved ${example} as ${key}`);
            }

      - name: Verify and list Pitagora examples
        run: python scripts/pitagora_examples.py --verify-output

      - name: Verify generated examples
        run: |
          test -n "$(find docs/public/examples -maxdepth 1 -name '*.plotly.json' -print -quit)"
          test -n "$(find docs/public/examples -maxdepth 1 -name '*.html' -print -quit)"
          test -n "$(find docs/public/example-domains -maxdepth 1 -name '*.vtp' -print -quit)"

      - name: Check example metadata, figures and download routes
        run: python scripts/check_examples.py --require-figures

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        working-directory: docs
        run: npm ci

      - name: Build site
        working-directory: docs
        run: npm run build

      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist
