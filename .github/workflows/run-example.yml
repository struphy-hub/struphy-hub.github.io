name: Generate example

on:
  workflow_call:
    inputs:
      example:
        description: Example script stem
        required: true
        type: string

permissions:
  contents: read

jobs:
  # The caller schedules only cache misses. Recheck in case another run filled
  # the cache while this job was queued.
  run-example:
    name: ${{ inputs.example }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: ghcr.io/struphy-hub/struphy/ubuntu-with-struphy:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Each run is deterministic (fixed seeds), so cache on this example script's and
      # Python requirements, and skip the expensive rebuild when neither changed. Every
      # file an example writes is named after its script stem (the metadata JSON, the
      # figures, their thumbnails); no example's stem is a prefix of another's, and the
      # glob also covers two-stream-instability's extra "-phasespace" pair.
      - name: Cache generated example
        id: cache-example
        uses: ./.github/actions/cache-example
        with:
          example: ${{ inputs.example }}
          cache-prefix: struphy-example-serial-v1

      - name: Install Python dependencies from PyPI
        id: install-python
        # Replace the image's editable Struphy install with a released wheel.
        # The gallery extra provides Plotly exports and profiling helpers.
        if: steps.cache-example.outputs.cache-hit != 'true'
        shell: bash
        run: |
          source /struphy_fortran_/env_fortran_/bin/activate
          python -m pip uninstall -y struphy
          python -m pip install --upgrade -r requirements-examples.txt
          python - <<'PY'
          import os
          import sysconfig
          from importlib.metadata import distribution, version
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"struphy-path={distribution('struphy').locate_file('struphy')}", file=output)
              print(f"struphy-version={version('struphy')}", file=output)
              print(f"python-abi={sysconfig.get_config_var('SOABI')}", file=output)
              print(f"pyccel-version={version('pyccel')}", file=output)
          PY

      - name: Rebuild GVEC for this runner's CPU
        # The published gvec wheel is built with -march=native. GitHub-hosted
        # runners can expose an older CPU than the wheel builder, which makes
        # gvec.run terminate with SIGILL. Build from source here so its native
        # instructions match the processor that will run the equilibrium.
        if: inputs.example == 'gvec-equilibrium' && steps.cache-example.outputs.cache-hit != 'true'
        shell: bash
        run: |
          source /struphy_fortran_/env_fortran_/bin/activate
          lscpu | grep -E 'Model name|Flags'
          python -m pip install --no-binary=gvec --no-cache-dir --no-deps --force-reinstall 'gvec==1.5.0'

      # Cache kernels in the installed package, using the resolved release and
      # Python/compiler versions so an upgraded wheel gets a fresh compilation.
      - name: Cache compiled Struphy kernels
        id: cache-kernels
        if: steps.cache-example.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.install-python.outputs.struphy-path }}/**/__pyccel__
            ${{ steps.install-python.outputs.struphy-path }}/**/*.so
          key: struphy-kernels-pypi-${{ runner.os }}-${{ runner.arch }}-${{ steps.install-python.outputs.struphy-version }}-${{ steps.install-python.outputs.python-abi }}-${{ steps.install-python.outputs.pyccel-version }}-${{ hashFiles('requirements*.txt') }}

      # Chrome doesn't depend on the Struphy release or example scripts, so cache it under
      # its own static key instead of the cache-example key above -- otherwise every
      # cache-miss shard redundantly re-downloads ~150-200MB from Google plus its apt
      # dependencies for no reason.
      - name: Cache Chrome
        if: steps.cache-example.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: |
            /var/cache/apt/archives/*.deb
            /tmp/chrome.deb
          key: chrome-for-kaleido-v1

      - name: Install Chrome for kaleido
        # kaleido>=1.0 drives Chrome via choreographer instead of bundling a binary, and
        # doesn't auto-download it -- without this, figure.write_image(...) fails with
        # ChromeNotFoundError on a bare container that has no browser installed.
        #
        # Deliberately *not* `kaleido_get_chrome`: it downloads a standalone Chrome build
        # with no shared libraries installed, which crashes on startup on a bare Ubuntu
        # image ("browser closed immediately after starting") -- and choreographer always
        # prefers that self-managed download over a system browser, so it has to not exist
        # in the first place. Installing Google Chrome via apt instead lets apt resolve the
        # actual runtime dependencies (libnss3, libatk-bridge, libgbm, ...) correctly for
        # whatever Ubuntu version this image uses.
        if: steps.cache-example.outputs.cache-hit != 'true'
        shell: bash
        run: |
          apt-get update
          if [ ! -f /tmp/chrome.deb ]; then
            apt-get install -y wget
            wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          fi
          apt-get install -y /tmp/chrome.deb

      - name: Compile Struphy kernels
        if: steps.cache-example.outputs.cache-hit != 'true' && steps.cache-kernels.outputs.cache-hit != 'true'
        shell: bash
        run: |
          source /struphy_fortran_/env_fortran_/bin/activate
          struphy compile -y --language fortran

      - name: Generate example metadata
        # Cheap (imports the script's module-level Simulation(...) without running it). Only
        # this shard's example: its cache above only retains that example's metadata JSON, and
        # a script that fails to import must fail its own shard, not every shard. check-site in
        # build-site.yml generates the metadata of every example.
        if: steps.cache-example.outputs.cache-hit != 'true'
        shell: bash
        run: |
          source /struphy_fortran_/env_fortran_/bin/activate
          python generate_examples.py "${{ inputs.example }}"

      - name: Run example
        if: steps.cache-example.outputs.cache-hit != 'true'
        working-directory: docs/public/examples
        shell: bash
        run: |
          source /struphy_fortran_/env_fortran_/bin/activate
          export OMP_NUM_THREADS=1
          # Stream Python output to the job log as it is produced.
          export PYTHONUNBUFFERED=1
          set -x
          # run_example.py runs the script and publishes its figures, profiling and metadata here.
          timeout 90m python ../../../run_example.py "${{ inputs.example }}"
          set +x
          if [ ! -f "${{ inputs.example }}.plotly.json" ]; then
            echo "::error::${{ inputs.example }}: the run did not write the Plotly figure."
            exit 1
          fi
          if [ ! -f "${{ inputs.example }}.html" ]; then
            echo "::error::${{ inputs.example }}: the run did not write the standalone HTML figure."
            exit 1
          fi

      - name: Copy example thumbnails
        if: steps.cache-example.outputs.cache-hit != 'true'
        run: |
          for f in docs/public/examples/${{ inputs.example }}*.png; do
            if [ -e "$f" ]; then
              cp "$f" docs/public/images/examples/
            fi
          done

      - name: Export the domain used by this example
        if: steps.cache-example.outputs.cache-hit != 'true'
        shell: bash
        run: |
          source /struphy_fortran_/env_fortran_/bin/activate
          python generate_example_domain.py "${{ inputs.example }}" \
            --metadata-root docs/public/examples/struphy_gallery_runs \
            --output-dir docs/public/example-domains

      - name: Clean up simulation scratch output
        if: steps.cache-example.outputs.cache-hit != 'true'
        run: rm -rf docs/public/examples/struphy_gallery_runs docs/public/examples/struphy.log

      - name: Verify generated example
        run: |
          test -f "docs/public/examples/${{ inputs.example }}.plotly.json"
          test -f "docs/public/examples/${{ inputs.example }}.html"

      - name: Upload generated example
        uses: actions/upload-artifact@v4
        with:
          name: generated-example-${{ inputs.example }}
          path: |
            docs/public/examples/${{ inputs.example }}*
            docs/public/images/examples/${{ inputs.example }}*
            docs/public/example-domains/${{ inputs.example }}*
          retention-days: 1
